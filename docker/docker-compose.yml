services:
  postgres:
    image: postgres:16
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: devops-api
    environment:
        DATABASE_URL: postgresql+psycopg://devops_user:${POSTGRES_PASSWORD}@postgres:5432/devops_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
    name: devops-project-postgres-data